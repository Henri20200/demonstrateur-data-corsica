# Rafraîchissement planifié du pipeline : fetch → prepare → figures → verrous → commit.
# Garde frais le mix temps réel (T1 « en ce moment » avertit > 24 h et bloque > 48 h) :
# seuls outputs/ et data/raw/_manifest.json — déjà versionnés — sont commités.
#
# DEUX SUJETS, DEUX JEUX DE VISUELS. Toute sortie du livrable doit être régénérée ici :
# une figure produite à la main sur un poste finit par diverger de la donnée, et le run
# suivant l'écraserait ou la laisserait vieillir en silence. D'où les étapes « air »,
# ajoutées le 01/08/2026 — elles manquaient, et rien ne l'aurait signalé.
# Ne tourne que depuis la branche par défaut (règle GitHub pour les crons).

name: pipeline

on:
  schedule:
    # Toutes les 6 h, décalé de l'heure pile (les crons « pile » subissent plus de retards).
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Jamais deux runs en parallèle : ils committeraient l'un sur l'autre.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  rafraichir:
    runs-on: ubuntu-latest
    # Remonté au niveau du job pour être lisible dans un `if:` de step — un `env:` de
    # step ne l'est pas dans la condition du même step. La clé sert à savoir SI la
    # vitrine peut être déployée ; la valeur, elle, ne circule que dans l'étape qui
    # déploie (GitHub la masque de toute façon dans les logs).
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
    # 25 min : le premier run après l'arrivée du sujet air télécharge ~90 Mo de plus
    # (tranche météo close 2020-2024, et les Parquet de l'AEE). Les runs suivants les
    # retrouvent dans le cache — sauf éviction, cf. la note sur le volume ci-dessous.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Par défaut, `checkout` laisse le jeton dans `.git/config` : toute étape
          # suivante peut alors pousser sur `master`, y compris les douze qui exécutent du
          # code tiers non épinglé. C'est le chemin le plus direct entre un paquet PyPI
          # compromis et l'empoisonnement du dépôt ; il se ferme en une ligne, l'étape de
          # commit portant désormais son identifiant elle-même.
          #
          # DEFENSE PARTIELLE, et il faut le dire : GitHub définit les permissions du
          # `GITHUB_TOKEN` au niveau workflow/job, jamais par étape, et `github.token`
          # reste accessible partout. Ce qui disparaît est le credential Git PERSISTÉ,
          # pas le jeton. Confiner véritablement `contents: write` demanderait de scinder
          # le cron en plusieurs jobs — arbitré NON le 30/08/2026 : 193 Mo de `data/raw`
          # à faire franchir une frontière de job quatre fois par jour, pour un pipeline
          # qui dure deux à quatre minutes, sous un plafond de 20 EUR/mois où les minutes
          # d'Actions sont le seul compute récurrent. Risque résiduel accepté en connaissance.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le pipeline
        run: python -m pip install -e . pytest

      # data/ n'est pas versionné : ce cache inter-runs joue le rôle du disque local.
      # Les sources figées ne sont ainsi pas re-téléchargées, et si le rafraîchissement
      # du temps réel échoue, fetch conserve le relevé précédent (au lieu de repartir
      # de zéro et de faire échouer prepare).
      # CLÉ INDEXÉE SUR sources.yaml, et non sur l'identifiant de run (corrigé le
      # 01/08/2026). Avec `github.run_id`, chaque passage écrivait une entrée NEUVE : depuis
      # le sujet air, data/raw approche 150 Mo, soit 600 Mo de cache par jour à raison de
      # quatre runs — le quota de 10 Go se remplissait en deux semaines, puis l'éviction
      # forçait un retéléchargement complet. Indexée sur le contenu de sources.yaml, une
      # seule entrée existe par version du fichier ; elle n'est réécrite que le jour où une
      # source est ajoutée ou modifiée, et `restore-keys` récupère alors la précédente pour
      # ne télécharger que la nouveauté.
      # Contrepartie assumée : les jeux GLISSANTS que le cache conserve restent ceux du
      # premier run. Sans conséquence — ils sont rafraîchis à chaque passage par
      # définition, et s'ils ne l'étaient pas, la garde de fraîcheur de T1 le dirait
      # (avertissement au-delà de 24 h, blocage au-delà de 48 h). À surveiller si la durée des runs dérive.
      - name: Restaurer data/raw des runs précédents
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/raw
          key: data-raw-${{ hashFiles('sources.yaml') }}
          restore-keys: data-raw-

      # Le cache ne transporte que la DONNÉE : _manifest.json, lui, est versionné et
      # fait autorité. Sans cette restauration, un manifeste périmé issu du cache
      # écrase celui du checkout — fetch vérifie alors contre la mauvaise référence
      # et re-committe l'ancien manifeste (incident du 22/07/2026, cf. b1f5326).
      - name: Le manifeste versionné fait autorité sur celui du cache
        run: git checkout -- data/raw/_manifest.json

      - name: Collecte (fetch-data)
        id: fetch
        # Une source en échec ne bloque pas la publication des autres (philosophie de
        # fetch.py) ; l'échec est re-signalé en fin de run pour rester visible.
        continue-on-error: true
        env:
          # Jeton API ENTSO-E (étude Corse vs Sardaigne) : secret de dépôt à créer
          # dans Settings → Secrets and variables → Actions. Vide tant qu'aucune
          # source de sources.yaml ne référence ${ENTSOE_TOKEN} — sans effet d'ici là.
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          # Clé Geod'air (référentiel des sites de mesure corses), portée par l'en-tête
          # `apikey:` et non par l'url. Absente, la seule source `geodair_stations` échoue
          # et le run continue : `tests/test_stations_air.py` se saute alors faute de brut,
          # sans rien invalider de ce qui est publié.
          GEODAIR_KEY: ${{ secrets.GEODAIR_KEY }}
          # Dépôt durable des millésimes (src/demonstrateur/depot.py). Bucket DISTINCT de
          # celui de la vitrine : celle-ci est tenue comme reflet exact d'outputs/ par un
          # `aws s3 sync --delete` qui effacerait l'archive au déploiement suivant —
          # `depot.configurer()` refuse d'ailleurs de s'y écrire. Variable de dépôt et non
          # secret : un nom de bucket n'en est pas un, et le voir dans les logs aide.
          # Absente, la collecte continue : les versions sont indexées
          # `payload_archived: false`, et le premier run qui en a les moyens les dépose.
          ARCHIVE_BUCKET: ${{ vars.ARCHIVE_BUCKET }}
          # Clé PROPRE à l'archive : restreinte à ce seul bucket, elle ne peut pas toucher
          # la vitrine, et le `--delete` qui synchronise la vitrine ne peut pas la toucher
          # non plus. Le garde-fou cesse d'être une condition dans du code pour devenir une
          # propriété du compte.
          #
          # LE REPLI SUR `SCW_*` A ÉTÉ RETIRÉ le 30/08/2026. `depot.configurer()` le
          # prévoit toujours — c'est le bon comportement pour qui démarre sans clé
          # dédiée — mais il n'a plus lieu d'être EXPOSÉ ici : `ARCHIVE_*` est en service
          # depuis ce jour-là, donc le repli ne servait plus, et il plaçait sous les yeux
          # du code Python de la collecte l'identité qui déploie la vitrine — celle qui
          # peut l'EFFACER par `--delete`. Elle n'est nécessaire qu'au déploiement, elle
          # n'est donc plus portée que par lui. Quatre secrets ici au lieu de six.
          ARCHIVE_ACCESS_KEY: ${{ secrets.ARCHIVE_ACCESS_KEY }}
          ARCHIVE_SECRET_KEY: ${{ secrets.ARCHIVE_SECRET_KEY }}
        run: fetch-data

      # Un index a toujours l'air complet — c'est sa nature de ne porter que des
      # métadonnées. Une version dont les octets ne sont jamais arrivés ne se verrait donc
      # nulle part, jusqu'au jour où l'on irait chercher un contenu qui n'existe plus.
      # TROIS LECTURES, et elles ne se répondent pas l'une l'autre — les confondre est ce
      # qui a laissé une clé malformée tenir une journée le 30/08/2026 derrière un cron
      # vert. Un compteur qui ne descend jamais à zéro cesse d'être lu, et emporte avec
      # lui le signal qui comptait.
      - name: Millésimes — ce qui reste à faire, et ce qui est perdu
        run: |
          python - <<'PY'
          from demonstrateur import archive

          def nommer(millesimes):
              return ", ".join(f"{source} {sha[:8]}" for source, sha in millesimes[:20])

          vivantes = archive.versions_courantes_sans_octets()
          attente = archive.versions_non_deposees()
          perdus = archive.versions_octets_perdus()

          # Le SEUL critère d'exploitation : zéro veut dire que tout contenu actuellement
          # détenu par la chaîne est durable. Annotation et non échec du run : une panne
          # passagère se rattrape au run suivant, et c'est `fetch` qui rougit quand la
          # cause est une configuration, donc quand aucune reprise ne viendra.
          if vivantes:
              print(f"::error::{len(vivantes)} version(s) VIVANTE(S) sans octets durables — "
                    f"l'archive ne remplit pas son office : {nommer(vivantes)}")
          elif attente:
              print(f"::warning::{len(attente)} millésime(s) à reprendre au prochain run : "
                    f"{nommer(attente)}")
          else:
              print("::notice::Archive à jour : aucune version déposable en attente.")

          # Constat stable, jamais une tâche : ces octets n'existent plus nulle part, et
          # `data/archive/` n'est ni versionné ni porté par le cache. Les compter parmi
          # les reprises dues annonçait 86 travaux dont aucun n'était possible.
          if perdus:
              print(f"::notice::{len(perdus)} millésime(s) dépassé(s) sans octets — dette "
                    "historique, aucune reprise possible.")
          PY

      - name: Préparation (Parquet)
        run: python -m demonstrateur.prepare

      - name: Figures — électricité
        id: figures
        # Code 1 = relevé au-delà du seuil de blocage (24 h depuis le 27/08/2026) : le
        # visuel T1, avertissement en tête, doit être publié quand même — c'est lui qui
        # dit la vérité au lecteur, et son âge se recalcule désormais chez celui-ci.
        continue-on-error: true
        run: python -m demonstrateur.figures

      # Étape à part, et SANS continue-on-error : la note lit ses chiffres dans les
      # Parquet ; si cette lecture échoue, il ne faut pas publier une note muette à côté
      # de figures qui, elles, ont réussi.
      - name: Note méthodologique — électricité
        run: python -m demonstrateur.note_elec

      # Pas de continue-on-error ici, à la différence de l'étape électricité : celle-ci
      # tolère un code 1 parce qu'un T1 « affichage suspendu » DOIT être publié. Les
      # figures de l'air, elles, refusent de se dessiner quand leur titre devient faux
      # (une garde par figure) — c'est précisément le cas où il ne faut RIEN publier.
      - name: Figures — air, note et page assemblée
        run: |
          python -m demonstrateur.figures_air
          python -m demonstrateur.note_air
          python -m demonstrateur.page_air

      # La page de l'étude lit la hauteur de chaque iframe DANS le HTML du visuel : une
      # figure régénérée à une autre hauteur périme la page sans rien casser de visible.
      # Elle se recompile donc après les figures, et avant les verrous qui la vérifient.
      - name: Page de l'étude
        run: python -m demonstrateur.compile_etude

      # En dernier des producteurs : la page d'entrée affiche la date de compilation et
      # le compteur d'actualisations, qui ne sont justes qu'une fois tout le reste écrit.
      - name: Page d'entrée
        run: python -m demonstrateur.accueil

      # Garde-fou avant publication : si un verrou de résultat casse (données EDF
      # révisées, changement de version de lib…), on ne committe rien et le run alerte.
      - name: Verrous de résultats
        run: pytest

      - name: Committer visuels + manifeste si changement
        # Le dépôt étant privé, `pull` comme `push` demandent une authentification, et
        # `persist-credentials: false` en a privé le remote. L'url authentifiée est passée
        # aux deux commandes sans jamais être écrite dans `.git/config` : le jeton ne
        # survit pas à l'étape. Sa valeur brute est masquée par Actions si elle apparaît.
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `_versions.json` accompagne le manifeste : le manifeste dit ce que la source
          # dit AUJOURD'HUI, l'index des millésimes dit quelle version nous détenions
          # ENTRE QUAND ET QUAND. C'est la seule information de l'archive qui ne se
          # reconstruit pas après coup — le contenu, lui, reste dans data/ (non versionné).
          # Ne bouge que lorsqu'une empreinte a changé : ne fabrique donc pas de commit
          # à vide, la propriété « ne committe que ce qui a réellement changé » tient.
          git add outputs data/raw/_manifest.json
          # Sous condition d'existence : `git add` sur un chemin absent est fatal, et une
          # collecte entièrement en échec ne produit aucun index — ce n'est pas une raison
          # pour faire échouer la publication des visuels.
          if [ -f data/archive/_versions.json ]; then
            git add data/archive/_versions.json
          fi
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "chore(data): rafraîchissement planifié des visuels et du manifeste"
            depot="https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase "$depot" master
            git push "$depot" HEAD:master
          fi

      # --- Vitrine publique ---------------------------------------------------------
      # Le cron est déjà seul propriétaire d'outputs/ ; il l'est jusqu'au bout. Déployer
      # à la main laisserait la vitrine vieillir entre deux dépôts, alors que les visuels
      # se rafraîchissent ici toutes les 6 h — et c'est cette fraîcheur qu'on met en avant.
      #
      # Placé APRÈS les verrous de résultats, qui n'ont pas de continue-on-error : rien ne
      # part en ligne si un verrou casse. En revanche une collecte partiellement en échec
      # se déploie quand même, exactement comme elle se committe ci-dessus — c'est
      # l'arbitrage déjà retenu pour T1 « affichage suspendu », dont le lecteur doit
      # justement pouvoir constater qu'il est suspendu.
      - name: Déployer la vitrine (Scaleway Object Storage)
        if: env.SCW_ACCESS_KEY != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
          BUCKET: air-et-energie-en-corse
          ENDPOINT: https://s3.fr-par.scw.cloud
        run: |
          # plotly.min.js d'abord, avec un cache long : 4,7 Mio identiques d'un run à
          # l'autre, que personne n'a de raison de retélécharger. Il monte avant les
          # pages qui le référencent.
          aws s3 sync outputs/ "s3://$BUCKET/" --endpoint-url "$ENDPOINT" \
            --exclude "*" --include "plotly.min.js" \
            --acl public-read --cache-control "public, max-age=31536000, immutable"
          # Les pages ensuite, cache court : elles changent toutes les 6 h, et une vitrine
          # qui met sa fraîcheur en avant ne peut pas être servie périmée. --delete tient
          # le bucket comme reflet exact d'outputs/ plutôt que comme dépotoir de fichiers
          # oubliés ; les filtres valant aussi pour la suppression, le plotly.min.js exclu
          # ici n'est pas balayé au passage.
          aws s3 sync outputs/ "s3://$BUCKET/" --endpoint-url "$ENDPOINT" \
            --exclude "plotly.min.js" --delete \
            --acl public-read --cache-control "public, max-age=300"

      # Sauter sans bruit serait pire que casser : la vitrine cesserait de suivre les
      # visuels sans que rien ne le dise. Le run reste vert (les visuels, eux, sont bien
      # publiés) mais l'avertissement est visible dans le résumé.
      - name: Vitrine non déployée — secret absent
        if: env.SCW_ACCESS_KEY == ''
        run: |
          echo "::warning::SCW_ACCESS_KEY absent : visuels commités, vitrine NON mise à jour."

      - name: Signaler un échec de collecte ou de fraîcheur
        if: steps.fetch.outcome == 'failure' || steps.figures.outcome == 'failure'
        run: |
          echo "::error::Collecte ou fraîcheur en échec (fetch=${{ steps.fetch.outcome }}, figures=${{ steps.figures.outcome }}) — voir les étapes ci-dessus."
          exit 1
