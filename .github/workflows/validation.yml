# Garde de validation sur push/PR (AUD-06) : lint + tests + hygiène du diff.
# Séparée du pipeline planifié (pipeline.yml) par moindre privilège : ici lecture
# seule, AUCUN secret, aucune publication — une PR (même issue d'un fork) ne peut
# ni écrire dans le dépôt ni voir le jeton ENTSO-E. Ne pas greffer pull_request
# sur pipeline.yml, qui cumule contents:write + secret + push vers master.
#
# `valider` tient le code sous uv.lock, sans données. `verrous` rejoue les données
# du cache dans deux environnements : celui du cron, verrouillé, et les dernières
# dépendances autorisées, comme canari avant toute mise à jour du verrou.

name: validation

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Un nouveau push sur la même branche rend le run en cours obsolète : on l'annule.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Historique complet : requis pour comparer à la base de la PR (diff --check).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # Environnement reproductible : exactement uv.lock, rien d'autre (recoupe AUD-10).
      - name: Installer depuis uv.lock
        run: uv sync --locked --extra dev --python ${{ matrix.python }}

      - name: Lint (ruff)
        run: uv run --no-sync ruff check src

      - name: Tests
        run: uv run --no-sync pytest

      - name: Hygiène du diff (espaces parasites)
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD

  # Les verrous de résultats à l'épreuve de vraies données, AVANT la fusion.
  #
  # POURQUOI CE JOB EXISTE. `valider` n'a pas de données — data/ n'est pas versionné —
  # donc une trentaine de verrous s'y sautent en silence. Un verrou neuf n'était éprouvé
  # qu'au premier passage du cron, six heures plus tard, et son échec coûtait une
  # publication : rien ne se déploie tant qu'un verrou casse. Les quatre échecs de cron
  # du 13 au 28/08/2026 (sur 60 runs) viennent tous de là — trois fois la donnée d'un
  # producteur qui bouge, une fois l'environnement.
  #
  # TROIS CHOIX VOULUS, chacun contre une façon de rendre la garde muette :
  #  1. Le cron et les verrous de production suivent uv.lock. Le parcours séparé
  #     « dernières » conserve l'alerte sur les évolutions de dépendances qui a motivé
  #     ce job : il faut détecter leur casse avant de mettre le verrou à jour.
  #  2. La donnée vient du cache du pipeline en LECTURE SEULE (`cache/restore`) : une PR
  #     ne doit ni écrire ce cache ni provoquer l'éviction de l'entrée dont le cron vit.
  #  3. Sans cache, le job ÉCHOUE. Il a d'abord averti puis laissé passer, ce qui
  #     contredisait la raison invoquée — une garde qui se croit verte alors qu'elle n'a
  #     rien éprouvé est pire que pas de garde, et c'est précisément ce qu'un
  #     avertissement produisait. Corrigé le 13/09/2026, le jour où la même forme de
  #     silence a coûté deux runs : un contrôle qui se tait quand sa matière manque ne
  #     protège rien. Un cache vide se résout (relancer le pipeline), il ne se traverse
  #     pas.
  verrous:
    # Conserver le nom du contrôle de production pour les éventuelles protections de branche.
    name: ${{ matrix.dependances == 'verrouillees' && 'verrous' || 'verrous (dernieres)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dependances: [verrouillees, dernieres]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Installer comme le cron depuis uv.lock
        if: matrix.dependances == 'verrouillees'
        run: uv sync --locked --extra dev --python 3.12

      - name: Tester les dernières dépendances autorisées
        if: matrix.dependances == 'dernieres'
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e . pytest

      - name: Activer l'environnement du parcours
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Restaurer data/raw du pipeline (lecture seule)
        id: donnees
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: data/raw
          key: data-raw-${{ hashFiles('sources.yaml') }}
          restore-keys: data-raw-

      # ÉCHEC, et non plus avertissement (13/09/2026). Ce job n'existe que pour éprouver
      # les verrous sur des données avant fusion : sans cache, il n'éprouve rien et son
      # vert signifiait exactement le contraire de ce qu'on lui demandait d'attester.
      # C'est le défaut même que la journée a corrigé ailleurs — une garde qui se tait
      # quand sa matière manque protège autant qu'une garde absente. Un cache vide est
      # une situation à résoudre (relancer le pipeline pour le reconstituer), pas à
      # traverser.
      - name: Aucune donnée en cache
        if: steps.donnees.outputs.cache-matched-key == ''
        run: |
          echo "::error::Aucun cache data/raw — les verrous n'ont PAS été éprouvés sur données. Relancer le pipeline (workflow_dispatch) pour reconstituer le cache, puis relancer cette validation."
          exit 1

      # Ici, contrairement au pipeline, le manifeste du CACHE fait autorité — et c'est
      # délibéré. Le pipeline restaure le manifeste versionné parce qu'il va collecter
      # puis le re-committer ; ce job ne collecte pas. Les octets du cache et les
      # empreintes qui les accompagnent forment un couple cohérent, tandis que le
      # manifeste versionné a suivi les sources glissantes depuis : imposer l'un à
      # l'autre ferait échouer `prepare` sur une empreinte qui n'a jamais menti.
      # Ne PAS ajouter ici le `git checkout -- data/raw/_manifest.json` du pipeline.
      - name: Préparation (Parquet)
        if: steps.donnees.outputs.cache-matched-key != ''
        run: python -m demonstrateur.prepare

      # Même place que dans le pipeline, et pour la même raison : ce job existe pour
      # éprouver les verrous sur des données AVANT fusion, or les verrous de résultats
      # s'exécutent après les figures. Une PR qui amputerait la fenêtre doit échouer
      # ici, pas après avoir produit des visuels cohérents avec une donnée trouée.
      - name: Contrôle de couverture (bloquant)
        if: steps.donnees.outputs.cache-matched-key != ''
        run: python -m demonstrateur.couverture

      # La chaîne du cron, dans son ordre. Les verrous des pages lisent ce que ces
      # commandes écrivent : sans elles, ils compareraient la page publiée à des données
      # plus anciennes et seraient rouges pour une raison qui n'est pas le diff.
      # `figures` tolère son code 2 (relevé trop vieux), qui est la normale sur un cache —
      # et LUI SEUL depuis le 20/09/2026. Le `|| true` d'avant avalait aussi bien une
      # exception de génération : `outputs/` étant versionné, les verrous relisaient alors
      # les HTML du dernier commit du cron et ce job pouvait passer au vert sur une PR qui
      # casse une figure. C'est le trou exact dans ce qu'il existe pour attester.
      - name: Figures et pages, comme le cron
        if: steps.donnees.outputs.cache-matched-key != ''
        run: |
          code=0
          python -m demonstrateur.figures || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::Échec technique de la génération des figures (code $code)."
            exit "$code"
          fi
          python -m demonstrateur.note_elec
          python -m demonstrateur.figures_air
          python -m demonstrateur.note_air
          python -m demonstrateur.page_air
          python -m demonstrateur.compile_etude
          python -m demonstrateur.preuve_demande
          python -m demonstrateur.accueil

      # Tout sauf les verrous d'exploitation (`fraicheur`), qui mesurent la date du
      # dernier passage du cron et non le code — cf. leur déclaration dans pyproject.
      - name: Verrous de résultats
        if: steps.donnees.outputs.cache-matched-key != ''
        run: pytest -m "not fraicheur"
