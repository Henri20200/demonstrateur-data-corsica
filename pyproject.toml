[project]
name = "demonstrateur-data-corsica"
version = "0.1.0"
description = "Démonstrateur d'analyse de données ouvertes corses — daté, sourcé, reproductible"
requires-python = ">=3.11"
# Le CODE est sous EUPL-1.2 ; les DONNÉES gardent la licence de leur producteur
# (Licence Ouverte 2.0 Etalab sauf mention contraire dans sources.yaml).
license = "EUPL-1.2"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    # lxml non requis : parsing ENTSO-E via defusedxml, qui enveloppe xml.etree (stdlib)
    # sans changer son API. Nécessaire, pas confortable : les XML parsés viennent du
    # réseau et la stdlib expanse les entités internes (S-04 de l'audit du 30/08).
    "defusedxml>=0.7",
    # Épinglé : la version de Plotly détermine le contenu des HTML et du plotly.min.js
    # commités dans outputs/ — le CI planifié doit produire les mêmes octets qu'en local.
    "plotly==6.9.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "ipykernel",
    "ruff>=0.5",
    "pytest>=8.0",
]
insee = [
    "pynsee",
]

[project.scripts]
fetch-data = "demonstrateur.fetch:main"
compile-etude = "demonstrateur.compile_etude:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demonstrateur"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
# `fraicheur` : verrou d'EXPLOITATION, pas de code. Il mesure l'âge du dernier relevé,
# donc la date du dernier passage du cron — rien que le diff d'une PR puisse corriger.
# La CI de PR éprouve les verrous sur les données du cache, vieilles de quelques heures
# à quelques jours : y faire tourner celui-ci rendrait la garde rouge sans rien dire du
# code, et une garde qui crie à tort finit désarmée. Le cron, lui, joue TOUT.
markers = [
    "fraicheur: dépend de l'instant du dernier passage du cron, pas du code",
]
