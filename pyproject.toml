[project]
name = "demonstrateur-data-corsica"
version = "0.1.0"
description = "Démonstrateur d'analyse de données ouvertes corses — daté, sourcé, reproductible"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    "plotly>=5.22",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "ipykernel",
    "ruff>=0.5",
    "pytest>=8.0",
]
insee = [
    "pynsee",
]

[project.scripts]
fetch-data = "demonstrateur.fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demonstrateur"]

[tool.ruff]
line-length = 100
src = ["src"]
