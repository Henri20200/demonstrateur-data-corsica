    licence: "Réutilisation libre (CC-BY 4.0) — attribution : Agence européenne pour l'environnement (AEE). Donnée produite par Qualitair Corse, rapportée par le LCSQA/Ineris"
    producteur: "Agence européenne pour l'environnement — Air Quality Download Service (données FR.LCSQA-INERIS.AQ)"
    format: parquet
    colonnes_attendues: [Samplingpoint, Start, End, Value, Validity, Verification]
    notes: "AJACCIO CANETTO — ozone, 2013 -> 01/01/2025, Verification = 1."

