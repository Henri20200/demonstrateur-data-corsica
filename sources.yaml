# ============================================================
# Manifeste des sources de données
# Chaque entrée est téléchargée par `fetch-data`
# (ou : python -m demonstrateur.fetch)
# Date de collecte + empreinte SHA-256 + content-type enregistrés
# dans data/raw/_manifest.json — c'est la pièce "daté, sourcé".
#
# Champs :
#   url                : lien de téléchargement direct. Peut référencer une
#                        variable d'environnement avec ${NOM} (ex. jeton d'API :
#                        "...?securityToken=${ENTSOE_TOKEN}"). Le secret n'est
#                        expansé qu'au téléchargement — jamais écrit dans le
#                        manifeste ni les messages. En CI : secret GitHub Actions.
#   filename           : nom du fichier local dans data/raw/
#   licence            : licence de réutilisation (à citer dans chaque visuel)
#   producteur         : organisme producteur
#   entetes            : en-têtes HTTP envoyés avec la requête, `nom: valeur`. Les
#                        valeurs acceptent `${NOM}` comme l'url — tous les producteurs
#                        ne mettent pas leur jeton dans l'url (Geod'air attend un
#                        `apikey:`). Même régime que l'url : expansion au seul moment
#                        du téléchargement, valeur masquée dans tout message, et le
#                        manifeste n'enregistre que le gabarit — il dit QUE la source
#                        est authentifiée et par quelle variable, jamais le jeton.
#                        Un en-tête déclaré ne franchit JAMAIS une redirection qui
#                        change d'hôte (sinon le jeton partirait chez le tiers).
#                        Un test refuse tout en-tête d'authentification écrit en dur.
#   glissant           : true = jeu à fenêtre glissante, re-téléchargé à CHAQUE
#                        run (le cache n'est jamais un succès pour un jeu périssable)
#   date_url           : hier | aujourdhui — résout les jetons {AAAA}/{MM}/{JJ} de
#                        l'url pour les producteurs qui publient UN FICHIER PAR JOUR
#                        sans url stable (LCSQA). Contrairement à un secret, la date
#                        résolue EST écrite dans le manifeste : savoir quelle journée
#                        a été certifiée fait partie de la traçabilité. « hier » =
#                        journée close, donc 24 h complètes.
#   notes              : contexte, points à vérifier
#
# Champs de VALIDATION (fetch.py refuse d'enregistrer une donnée qui ne
# passe pas ces contrôles — une page d'erreur HTML ne doit JAMAIS être
# certifiée comme donnée dans le manifeste) :
#   format             : csv | csv.gz | geojson | json | xml
#   delimiter          : séparateur CSV (défaut ",")
#   colonnes_attendues : colonnes qui DOIVENT figurer dans l'en-tête
#   cle_attendue       : clé racine obligatoire pour un JSON/GeoJSON
#   racine_attendue    : élément racine obligatoire pour un XML (garde anti page d'erreur)
#   empreinte_ignore_xml : CHEMINS XML précis (depuis la racine) dont le contenu est neutralisé
#                        avant le SHA-256, ex. GL_MarketDocument/mRID + .../createdDateTime,
#                        réestampillés à chaque requête ENTSO-E. Cibler le chemin exact — et non un
#                        nom de balise n'importe où — préserve les mRID imbriqués des TimeSeries
#                        (donnée stable). Sans ça, l'empreinte porterait sur l'enveloppe de transport
#                        et ne serait pas reproductible ; avec, elle certifie la donnée. La
#                        vérification à chaque run et prepare l'appliquent aussi (cf. provenance.py).
# ============================================================

sources:

  # --- DVF géolocalisées (Etalab), Corse, millésime 2024 ---
  # Vérifier l'URL sur la fiche "Demandes de valeurs foncières
  # géolocalisées" de data.gouv.fr au premier lancement.
  dvf_2a_2024:
    url: "https://files.data.gouv.fr/geo-dvf/latest/csv/2024/departements/2A.csv.gz"
    filename: "dvf_2A_2024.csv.gz"
    licence: "Licence Ouverte 2.0"
    producteur: "DGFiP / Etalab — DVF géolocalisées"
    format: csv.gz
    delimiter: ","
    colonnes_attendues: [nature_mutation, valeur_fonciere, nom_commune, code_commune]

  dvf_2b_2024:
    url: "https://files.data.gouv.fr/geo-dvf/latest/csv/2024/departements/2B.csv.gz"
    filename: "dvf_2B_2024.csv.gz"
    licence: "Licence Ouverte 2.0"
    producteur: "DGFiP / Etalab — DVF géolocalisées"
    format: csv.gz
    delimiter: ","
    colonnes_attendues: [nature_mutation, valeur_fonciere, nom_commune, code_commune]

  # --- Contours des communes corses (région 94) ---
  communes_corse:
    url: "https://geo.api.gouv.fr/communes?codeRegion=94&format=geojson&geometry=contour"
    filename: "communes_corse.geojson"
    licence: "Licence Ouverte 2.0"
    producteur: "DINUM — geo.api.gouv.fr"
    format: geojson
    cle_attendue: features

  # --- Mix électrique Corse en temps réel (EDF, pas de 15 min) ---
  # Host migré vers le portail Groupe EDF : opendata-corse.edf.fr a son
  # catalogue déjà déprécié (HTTP 410). La Corse est une zone non
  # interconnectée (EDF SEI) : cette source EDF est LA source, sans repli RTE.
  # Profondeur = fenêtre glissante ~14 j, pas de 15 min, tout "Estimé", en UTC.
  edf_mix_temps_reel:
    url: "https://opendata.edf.fr/api/explore/v2.1/catalog/datasets/production-delectricite-par-filiere-en-temps-reel/exports/csv"
    filename: "edf_mix_temps_reel.csv"
    licence: "Licence Ouverte 2.0 (Etalab) — https://www.etalab.gouv.fr/licence-ouverte-open-licence"
    producteur: "EDF — Open Data Groupe EDF (production corse temps réel)"
    glissant: true   # fenêtre ~14 j : sans re-téléchargement, « en ce moment » périme
    format: csv
    delimiter: ";"
    colonnes_attendues: [date, total, photovoltaique, filiere_enr_distrib, statut]
    notes: >
      Télémesures/estimations. filiere_enr_distrib = photovoltaique + eolien
      + bioenergies + micro_hydro + solde_stockage (hors grande hydraulique et
      hors liaisons) — vérifié empiriquement, écart nul. Horodatage UTC.

  # --- Courbe de charge horaire par filière (historique, Corse & Outre-mer) ---
  # ATTENTION : l'ancien host opendata-corse-outremer.edf.fr est une SPA morte
  # (renvoyait du HTML en 200). Vrai host : opendata.edf.fr, même dataset id.
  # 5 territoires (Corse + 4 Outre-mer) — FILTRER territoire = 'Corse'.
  # Corse : horaire, 2019-01-01 -> 2024-12-31 (6 ans), 52 608 h, en UTC.
  edf_courbe_charge_horaire:
    url: "https://opendata.edf.fr/api/explore/v2.1/catalog/datasets/courbe-de-charge-de-la-production-delectricite-par-filiere/exports/csv"
    filename: "edf_courbe_charge_horaire.csv"
    licence: "Licence Ouverte (Etalab) — https://www.etalab.gouv.fr/licence-ouverte-open-licence"
    producteur: "EDF — Open Data Groupe EDF (Corse & Outre-mer)"
    format: csv
    delimiter: ";"
    colonnes_attendues: [territoire, date_heure, production_totale_mw, photovoltaique_mw, statut]
    notes: >
      Filtrer sur territoire = 'Corse'. Contient aussi cout_moyen_de_production
      (hors périmètre du démonstrateur). Fuseau UTC. Statut Corse : 2 ans validés
      + 4 ans estimés. stockage_mw nul en Corse. Correspondance temps réel :
      thermique_mw <-> filiere_thermique, importations_mw <-> liaisons.

  # --- Écrêtement ENR : limitations de production au titre de la sûreté système ---
  # Preuve chiffrée du "plafond de verre" du solaire insulaire. La Corse (ZNI) plafonne
  # l'injection instantanée des ENR intermittentes (PV + éolien SANS stockage) : 30 %
  # (arrêté du 23/04/2008) relevé à 35 % puis 45 %. Au-delà, le producteur est déconnecté
  # ou limité ("dernier arrivé en file, premier déconnecté" ; exception si couplé stockage).
  # Ce jeu chiffre, mois par mois, les heures max de déconnexion/limitation du PV.
  # Mensuel 2016-2023, multi-territoires -> FILTRER territoire = 'Corse' (comme la courbe).
  # Host EDF volatil (opendata-corse.edf.fr = 410 ; opendata.edf.fr a migré vers data-fair) :
  # on passe par le PERMALIEN data.gouv.fr, stable et redirigé (302) vers la ressource EDF.
  edf_ecretement_corse:
    url: "https://www.data.gouv.fr/api/1/datasets/r/ed02d0f2-3cf4-4ab0-a92c-322cd0496ef1"
    filename: "edf_ecretement_corse.csv"
    licence: "Licence Ouverte 2.0 (Etalab) — https://www.etalab.gouv.fr/licence-ouverte-open-licence"
    producteur: "EDF — Open Data Groupe EDF (limitations sûreté système, Corse & Outre-mer)"
    format: csv
    delimiter: ","
    colonnes_attendues: ["Territoire", "Mois", "Durée (h)"]
    notes: >
      Heures mensuelles max de déconnexion/limitation du PV au-delà du seuil d'injection
      des ENR intermittentes (35 % sur la période couverte, relevé ensuite vers 45 %).
      Colonne "Taux d'ENR interfacée par EP accepté (%)" renseignée à partir de 2019.
      Ressource EDF sous-jacente (backend data-fair, cible du 302) :
      https://opendata.edf.fr/data-fair/api/v1/datasets/deconnexions-des-installations-photovoltaiques/convert

  # --- Génération sarde par filière (ENTSO-E) : comparaison Corse vs Sardaigne ---
  # La Corse N'EST PAS une zone de marché ENTSO-E (incluse dans la France) : ENTSO-E ne
  # sert QUE pour la Sardaigne. Zone IT-Sardinia (EIC 10Y1001A1001A74G) ; on ignore les
  # 2 zones virtuelles d'interconnexion SACO* (liaisons Corse↔Sardaigne, zéro génération).
  # API REST : documentType=A75 (Actual Generation per Production Type), processType=A16
  # (réalisé). L'API plafonne A75 à 1 an par requête -> UNE entrée par année (2019-2024,
  # fenêtre de la courbe corse). securityToken via ${ENTSOE_TOKEN} (jamais dans le dépôt ;
  # secret GitHub Actions en CI). Réponse XML GL_MarketDocument, horaire, curveType A03
  # (heures manquantes = report de la dernière valeur, PAS des zéros — reconstruit dans
  # prepare). racine_attendue verrouille le garde-fou : une requête en erreur renvoie
  # HTTP 200 + Acknowledgement_MarketDocument, à ne jamais empreinter comme donnée.
  # empreinte_ignore_xml : GL_MarketDocument/mRID + createdDateTime changent à CHAQUE requête
  # (enveloppe de document, pas donnée) -> neutralisés avant le SHA-256 ; les mRID imbriqués des
  # TimeSeries (données) sont préservés. Fuseau Europe/Rome (= Europe/Paris). Licence : réutilisation ENTSO-E (CC-BY 4.0,
  # attribution). Génération métrée : PAS d'imports (Sardaigne exportatrice via SAPEI/SACOI).
  entsoe_sardaigne_2019:
    url: "https://web-api.tp.entsoe.eu/api?securityToken=${ENTSOE_TOKEN}&documentType=A75&processType=A16&in_Domain=10Y1001A1001A74G&periodStart=201901010000&periodEnd=202001010000"
    filename: "entsoe_sardaigne_2019.xml"
    licence: "ENTSO-E Transparency Platform — réutilisation libre (CC-BY 4.0, attribution ENTSO-E)"
    producteur: "ENTSO-E Transparency Platform (données Terna) — zone IT-Sardinia"
    format: xml
    racine_attendue: GL_MarketDocument
    empreinte_ignore_xml: ["GL_MarketDocument/mRID", "GL_MarketDocument/createdDateTime"]
  entsoe_sardaigne_2020:
    url: "https://web-api.tp.entsoe.eu/api?securityToken=${ENTSOE_TOKEN}&documentType=A75&processType=A16&in_Domain=10Y1001A1001A74G&periodStart=202001010000&periodEnd=202101010000"
    filename: "entsoe_sardaigne_2020.xml"
    licence: "ENTSO-E Transparency Platform — réutilisation libre (CC-BY 4.0, attribution ENTSO-E)"
    producteur: "ENTSO-E Transparency Platform (données Terna) — zone IT-Sardinia"
    format: xml
    racine_attendue: GL_MarketDocument
    empreinte_ignore_xml: ["GL_MarketDocument/mRID", "GL_MarketDocument/createdDateTime"]
  entsoe_sardaigne_2021:
    url: "https://web-api.tp.entsoe.eu/api?securityToken=${ENTSOE_TOKEN}&documentType=A75&processType=A16&in_Domain=10Y1001A1001A74G&periodStart=202101010000&periodEnd=202201010000"
    filename: "entsoe_sardaigne_2021.xml"
    licence: "ENTSO-E Transparency Platform — réutilisation libre (CC-BY 4.0, attribution ENTSO-E)"
    producteur: "ENTSO-E Transparency Platform (données Terna) — zone IT-Sardinia"
    format: xml
    racine_attendue: GL_MarketDocument
    empreinte_ignore_xml: ["GL_MarketDocument/mRID", "GL_MarketDocument/createdDateTime"]
  entsoe_sardaigne_2022:
    url: "https://web-api.tp.entsoe.eu/api?securityToken=${ENTSOE_TOKEN}&documentType=A75&processType=A16&in_Domain=10Y1001A1001A74G&periodStart=202201010000&periodEnd=202301010000"
    filename: "entsoe_sardaigne_2022.xml"
    licence: "ENTSO-E Transparency Platform — réutilisation libre (CC-BY 4.0, attribution ENTSO-E)"
    producteur: "ENTSO-E Transparency Platform (données Terna) — zone IT-Sardinia"
    format: xml
    racine_attendue: GL_MarketDocument
    empreinte_ignore_xml: ["GL_MarketDocument/mRID", "GL_MarketDocument/createdDateTime"]
  entsoe_sardaigne_2023:
    url: "https://web-api.tp.entsoe.eu/api?securityToken=${ENTSOE_TOKEN}&documentType=A75&processType=A16&in_Domain=10Y1001A1001A74G&periodStart=202301010000&periodEnd=202401010000"
    filename: "entsoe_sardaigne_2023.xml"
    licence: "ENTSO-E Transparency Platform — réutilisation libre (CC-BY 4.0, attribution ENTSO-E)"
    producteur: "ENTSO-E Transparency Platform (données Terna) — zone IT-Sardinia"
    format: xml
    racine_attendue: GL_MarketDocument
    empreinte_ignore_xml: ["GL_MarketDocument/mRID", "GL_MarketDocument/createdDateTime"]
  entsoe_sardaigne_2024:
    url: "https://web-api.tp.entsoe.eu/api?securityToken=${ENTSOE_TOKEN}&documentType=A75&processType=A16&in_Domain=10Y1001A1001A74G&periodStart=202401010000&periodEnd=202501010000"
    filename: "entsoe_sardaigne_2024.xml"
    licence: "ENTSO-E Transparency Platform — réutilisation libre (CC-BY 4.0, attribution ENTSO-E)"
    producteur: "ENTSO-E Transparency Platform (données Terna) — zone IT-Sardinia"
    format: xml
    racine_attendue: GL_MarketDocument
    empreinte_ignore_xml: ["GL_MarketDocument/mRID", "GL_MarketDocument/createdDateTime"]

  # --- Qualité de l'air : concentrations horaires de polluants réglementés ---
  # Flux « temps réel » national du LCSQA (format E2, celui du rapportage européen).
  # Aucune url stable : un fichier PAR JOUR, d'où les jetons {AAAA}/{MM}/{JJ} et
  # date_url. Archivé depuis 2021 sur le bucket, publié le jour même.
  # Périmètre corse (relevé le 30/07/2026) : 6 stations mesurent l'ozone — Ajaccio
  # Canetto, Ajaccio Confina 2, Bastia Giraud, Bastia Montesoro, Bastia La Marana,
  # Venaco (seule rurale de l'île). Les 2 stations trafic n'en mesurent pas.
  # Cf. docs/BRIEF_AIR.md pour la question fermée et les garde-fous.
  lcsqa_temps_reel:
    url: "https://files.data.gouv.fr/ineris/lcsqa/concentrations-de-polluants-atmospheriques-reglementes/temps-reel/{AAAA}/FR_E2_{AAAA}-{MM}-{JJ}.csv"
    filename: "lcsqa_temps_reel.csv"
    licence: "Licence Ouverte 2.0 (Etalab) — https://www.etalab.gouv.fr/licence-ouverte-open-licence"
    producteur: "LCSQA / Ineris — mesures des AASQA (Qualitair Corse pour l'île)"
    glissant: true      # une journée nouvelle chaque jour : le cache serait un faux succès
    # « avant-hier » et non « hier » : ALIGNEMENT sur Météo-France, pas prudence. Le
    # fichier météo est réécrit au petit matin, sa dernière journée est tronquée et prepare
    # la coupe — sa dernière journée complète est J-2 quand le LCSQA publie déjà J-1. À
    # « hier », les deux sources n'ont jamais une journée en commun (vérifié le 01/08/2026 :
    # air au 31/07, météo au 30/07, sortis du MÊME run) et le croisement ozone x chaleur
    # promis par le BRIEF devenait impossible sur la donnée fraîche. Un jour de fraîcheur
    # en moins ne coûte rien ; ne jamais pouvoir croiser, si.
    date_url: avant-hier
    format: csv
    delimiter: ";"
    colonnes_attendues: [Zas, nom site, Polluant, valeur, validité]
    notes: >
      Fichier NATIONAL (~12,7 Mo/jour, ~48 000 lignes), la Corse en représente ~1 % :
      le filtrage se fait en aval, dans prepare — on empreinte l'octet reçu, jamais un
      dérivé. Valeurs en µg/m³, moyennes horaires BRUTES et NON VALIDÉES : la colonne
      « validité » peut être négative (vu le 30/07/2026 sur Bastia Giraud) et doit être
      filtrée avant tout calcul. L'historique validé viendra de Geod'air (API à clé),
      source figée distincte — cf. docs/BRIEF_AIR.md.

  # --- Températures horaires corses (Météo-France) : le croisement du BRIEF air ---
  # PIÈGE DE PÉRIMÈTRE, vérifié le 01/08/2026 : pour ce jeu, Météo-France ne connaît
  # NI 2A NI 2B — l'île entière est publiée sous le département « 20 » (aucune ressource
  # H_2A_/H_2B_ dans le catalogue ; 57 postes sous H_20_). Un seul fichier, pas deux.
  # Le découpage du producteur épouse notre politique de fraîcheur à la lettre :
  #   H_20_latest-2025-2026.csv.gz    deux dernières années, réécrit chaque jour -> glissant
  #   H_20_previous-2020-2024.csv.gz  historique clos (82 Mo)                    -> figé
  # Le « previous » n'est PAS déclaré : il n'a de sens qu'en face de l'historique Geod'air,
  # dont ni la profondeur ni la date d'arrivée ne sont tranchées. Le jour venu, une entrée
  # figée de plus suffit — même url, même format.
  # ATTENTION : l'url porte ses millésimes. « latest-2025-2026 » deviendra
  # « latest-2026-2027 » au changement d'année ; aucun jeton {AAAA} ne sait écrire une
  # paire d'années. À corriger à la main en janvier 2027 — l'échec sera bruyant (404).
  # --- Températures horaires corses, tranche CLOSE 2020-2024 ---
  # Déclarée le 01/08/2026, quand l'historique d'ozone est arrivé : jusque-là ces 82 Mo
  # n'auraient été lus par personne, et leur empreinte re-vérifiée à chaque run pour rien.
  # Le brief l'avait prévu ainsi — « le jour venu, c'est une entrée figée de plus, même url,
  # même format ». Vérifiée sur pièce le 01/08/2026 : 81,9 Mo, 206 colonnes, première ligne
  # AJACCIO au 01/01/2020 à 00 h. Elle se raccorde sans trou au fichier glissant, qui
  # reprend au 01/01/2025 — le producteur découpe exactement là où la profondeur a été
  # tranchée. FIGÉE : tranche close, jamais réécrite, donc jamais retéléchargée.
  meteo_horaire_corse_2020_2024:
    url: "https://meteofrance.s3.sbg.io.cloud.ovh.net/data/synchro_ftp/BASE/HOR/H_20_previous-2020-2024.csv.gz"
    filename: "meteo_horaire_corse_2020_2024.csv.gz"
    licence: "Licence Ouverte 2.0 (Etalab) — https://www.etalab.gouv.fr/licence-ouverte-open-licence"
    producteur: "Météo-France — données climatologiques de base, horaires (département 20)"
    format: csv.gz
    delimiter: ";"
    colonnes_attendues: [NUM_POSTE, NOM_USUEL, AAAAMMJJHH, T, QT]
    notes: >
      Tranche close 2020-2024, pendant figé du fichier glissant. Mêmes colonnes, même
      fuseau UTC, mêmes codes qualité QT. Sa dernière journée n'est PAS tronquée
      (contrairement au glissant) : le fichier ne sera plus jamais réécrit.

  meteo_horaire_corse:
    url: "https://meteofrance.s3.sbg.io.cloud.ovh.net/data/synchro_ftp/BASE/HOR/H_20_latest-2025-2026.csv.gz"
    filename: "meteo_horaire_corse.csv.gz"
    licence: "Licence Ouverte 2.0 (Etalab) — https://www.etalab.gouv.fr/licence-ouverte-open-licence"
    producteur: "Météo-France — données climatologiques de base, horaires (département 20)"
    glissant: true      # réécrit quotidiennement : sans re-téléchargement, hier n'y est pas
    format: csv.gz
    delimiter: ";"
    colonnes_attendues: [NUM_POSTE, NOM_USUEL, AAAAMMJJHH, T, QT]
    notes: >
      ~27 Mo, 57 postes, ~755 000 lignes horaires depuis le 01/01/2025. T = température
      sous abri instantanée (°C et 1/10) ; AAAAMMJJHH est en UTC, comme les sources EDF.
      GARDE-FOU, la DERNIÈRE journée du fichier est TRONQUÉE : rafraîchi vers 05 h 47 UTC,
      il s'arrête aux petites heures du jour de publication (relevé le 01/08/2026 : dernière
      heure = 2026-07-31 03 h UTC). Une « journée » de 4 heures fausserait tout maximum
      journalier — la dernière date se coupe dans prepare, et le croisement avec le LCSQA
      (date_url: hier) porte sur la dernière journée COMPLÈTE commune aux deux sources,
      jamais sur la date la plus récente de l'une d'elles.
      QT est le code qualité, et il se filtre avant tout calcul, exactement comme la
      « validité » du LCSQA : 0 = protégée (validée par le climatologue), 1 = validée,
      9 = filtrée (contrôles de premier niveau), 2 = DOUTEUSE en cours de vérification.
      Relevé le 01/08/2026 : 735 053 heures en 1 et 17 440 en 9, aucune en 2 — le filtre
      reste dû, une valeur pouvant être remise en doute au fil des révisions.
      PIÈGE DE NOMMAGE : le poste « BASTIA » (20148001) n'est PAS à Bastia — 20148 = 2B148
      = Lucciana, c'est l'aéroport de Poretta, dans la plaine de la Marana. Bastia ville,
      c'est « BASTIA_SAPC » (20033015, 2B033). Le code commune que porte NUM_POSTE tranche
      là où le nom trompe : les deux postes sont distants de 18,5 km. Postes retenus face aux
      6 stations d'ozone : AJACCIO-MILELLI_SAPC (20004014) pour le Canetto, à 1,88 km, et non
      Campo dell'Oro (20004002) 2,5 fois plus loin ; mais Campo dell'Oro pour CONFINA 2, qui
      en est 2 fois plus près et domine la plaine de la Gravona — les deux stations d'Ajaccio
      sont à 5,6 km l'une de l'autre et ne partagent pas leur poste ; BASTIA_SAPC pour les deux
      stations urbaines de Bastia, BASTIA/Poretta pour celle de la Marana ; VIVARIO_SAPC (20354008)
      pour Venaco, qui n'a aucun poste sur sa commune — et NON Corte, pourtant plus proche
      en distance comme en altitude, dont la cuvette encaissée creuse l'amplitude diurne.
      L'appariement complet et ses raisons sont dans `prepare.APPARIEMENT_AIR_METEO` ; il
      s'écrit sur la figure : ce n'est pas la même mesure au même endroit.
      Le fichier porte ~200 colonnes (vent, pression, nébulosité…) ; GLO (rayonnement
      global, J/cm²) est le seul autre champ tentant pour l'ozone — hors BRIEF, à ne pas
      ouvrir sans décision.

  # --- Référentiel des sites de mesure corses (Geod'air) ---
  # Le SEUL endroit où les caractéristiques des stations sont écrites par leur producteur :
  # date d'entrée en service, implantation, influence, altitude, coordonnées. Jusqu'ici
  # `prepare.STATIONS_AIR` les portait RECOPIÉES à la main — exactes, mais invérifiables
  # depuis le dépôt, et une note du livrable en affirme le chiffré (« 2006-2011 »).
  # `tests/test_stations_air.py` confronte désormais la table au référentiel.
  # region=94 : code Insee de la Corse — l'export national fait 511 sites pour 8 corses.
  # ATTENTION, 2A/2B et jamais 20 côté Insee (Météo-France, lui, publie sous « 20 » —
  # cf. plus haut) ; on filtre par région, ce qui évite d'avoir à trancher.
  # Le référentiel est VERSIONNÉ (colonnes Version, Date de début de version) : une
  # station remaniée gagne une ligne. Les 8 sites corses n'ont qu'une version au 07/08/2026.
  # Répond DIRECTEMENT, sans le mécanisme d'export asynchrone des mesures (commande puis
  # téléchargement) : un GET, une clé en en-tête, rien de plus dans fetch.
  geodair_stations:
    url: "https://www.geodair.fr/api-ext/station/export?region=94"
    filename: "geodair_stations.csv"
    licence: "Licence Ouverte (Etalab) — les informations produites par les membres du LCSQA
      sont mises à disposition par défaut sous Licence Ouverte
      (https://www.lcsqa.org/fr/conditions-utilisation-site). Le producteur n'en précise
      PAS la version : ne pas écrire « 2.0 » ici sans l'avoir vérifié chez lui."
    producteur: "Geod'air — LCSQA/Ineris, base nationale de la qualité de l'air (mesures Qualitair Corse)"
    entetes:
      apikey: "${GEODAIR_KEY}"
    glissant: true      # référentiel vivant : une station nouvelle ne doit pas nous échapper
    format: csv
    delimiter: ";"
    colonnes_attendues: [Code, Nom, "Date d'entrée en service (à 00h00)", Implantation, Altitude]
    notes: >
      8 sites corses au 07/08/2026, dont les 6 qui mesurent l'ozone. Les 2 autres :
      BASTIA FANGO (FR41060) et AJACCIO NAPOLEON (FR41073, en service depuis le
      11/07/2025, remplaçante d'Ajaccio Abbatucci) — à vérifier avant de conclure sur
      le périmètre, une station trafic ne mesure pas l'ozone.
      Le jeton ${GEODAIR_KEY} n'existe QUE dans .env en local et dans les secrets
      GitHub Actions : le manifeste n'enregistre que le gabarit.

  # ============================================================================
  # OZONE — Agence européenne pour l'environnement (AEE), un Parquet par station
  # ============================================================================
  # Bascule actée le 01/08/2026 : l'AEE sert la MÊME donnée que Geod'air, sans clé.
  # Le namespace des fichiers le dit — FR.LCSQA-INERIS.AQ : ce sont les mesures de
  # Qualitair Corse, rapportées par le LCSQA, telles que la France les transmet à
  # l'Europe. Deux jeux se raccordent bout à bout, distingués par le conteneur :
  #   airquality-p-e1a/  jeu E1a, données VALIDÉES, 2013 -> 01/01/2025      -> figé
  #   airquality-p/      jeu E2a, flux continu, 2025 -> ce matin            -> glissant
  # La colonne `Verification` porte la frontière DANS la donnée (1 = vérifié,
  # 2 = préliminaire, 3 = non vérifié) : les deux régimes du livrable n'ont pas à
  # être reconstitués, le producteur les déclare ligne à ligne.
  #
  # FUSEAU : UTC+1 FIXE, horodatage en FIN de période — l'inverse du flux LCSQA, qui
  # étiquette le début. Établi sur pièce, pas supposé : le décalage entre les deux
  # sources vaut +1 h en été COMME en hiver (écart max 0,00 µg/m³ sur les journées
  # communes du 30/07/2026 et du 15/01/2025). Un décalage de fuseau aurait varié d'une
  # saison à l'autre ; un décalage d'étiquetage, non. La conversion se fait dans prepare.
  #
  # URL déterministe : SPO-<code station>_<code polluant>.parquet, 7 = ozone. Les codes
  # station sont ceux de STATIONS_AIR (prepare.py), issus du référentiel du producteur.
  # Léger : ~230 Ko pour 19 mois de flux continu, ~1,5 Mo pour douze ans de validé.

