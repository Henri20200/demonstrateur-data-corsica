  # ============================================================================
  # DIOXYDE D'AZOTE — AEE, mêmes conteneurs, code polluant 8
  # ============================================================================
  # Sert le titre n° 3 du BRIEF (« le pic n'est pas à l'heure de pointe ») : l'heure
  # du maximum d'ozone contre celle du maximum de NO2, À STATION CONSTANTE. D'où ces
  # CINQ stations et non six — Venaco a mesuré le NO2 par le passé (le jeu validé en
  # porte), mais ne le mesure plus aujourd'hui. Comparer deux polluants au même endroit
  # exige qu'ils y soient tous deux mesurés : la station rurale sort du titre n° 3, et
  # n'a de toute façon pas d'heure de pointe à opposer.
  # Tout le reste est identique à l'ozone : conteneurs, fuseau (UTC+1 fixe, fin de
  # période), raccord des deux jeux, colonne Verification.

